<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DibyaRatna SelfEconomy</title>
    <style>
        body { background-color: #0f1115; color: #f0f2f5; font-family: sans-serif; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; }
        .logo { font-size: 3rem; font-weight: bold; color: #1976d2; margin-bottom: 10px; }
        .card { background-color: #161a22; border: 1px solid #242b35; border-radius: 12px; padding: 20px; margin: 20px 0; text-align: left; }
        .btn { display: block; width: 100%; background-color: #1c212c; border: 1px solid #242b35; color: #f0f2f5; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; text-align: center; }
        .btn:hover { border-color: #ff9800; }
        #live-feed { background-color: #0a0c10; border: 1px solid #242b35; border-radius: 8px; padding: 15px; min-height: 100px; overflow-y: auto; font-family: monospace; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">DR</div>
    <h1>DibyaRatna SelfEconomy</h1>
    <p style="color: #9aa0a6;">Node 1024 | Manifest: 1,023 | Purna: 0</p>

    <!-- The 8 Pillars Section -->
    <div class="card">
        <h3 style="color: #388e3c;">गाँस / Food</h3>
        <p style="color: #9aa0a6; font-size: 0.9rem;">108% Organic resource pre-orders.</p>
        <button class="btn" onclick="buyItem('गाँस / Food', 150)">Log Pre-Order (150 Credits)</button>
    </div>

    <!-- Live Activity Feed Tracker Box -->
    <div class="card" style="background-color: #121620;">
        <h3 style="color: #1976d2; margin-bottom: 10px;">Real-Time Node Ledger Activities</h3>
        <div id="live-feed">
            <div style="color: #8a94a6;">[SYSTEM] Connected. Awaiting local pre-order entry...</div>
        </div>
    </div>
</div>

<script>
    function buyItem(sectorName, costAmount) {
        const feed = document.getElementById('live-feed');
        if (feed.innerHTML.includes('Awaiting local pre-order')) {
            feed.innerHTML = '';
        }
        const reward = (costAmount * 0.10).toFixed(2);
        const time = new Date().toLocaleTimeString();
        
        feed.innerHTML += `
            <div style="margin-bottom: 10px; border-bottom: 1px dashed #242b35; padding-bottom: 5px;">
                <span style="color: #388e3c; font-weight: bold;">[SUCCESS]</span> ${time} - 
                Logged: <span style="color: #ff9800; font-weight: bold;">${sectorName}</span> | 
                Cost: <b>${costAmount} Credits</b> | 
                <span style="color: #1976d2; font-weight: bold;">10% Mukti Return: +${reward} Credits</span>
            </div>
        `;
        feed.scrollTop = feed.scrollHeight;
    }
</script>

</body>
</html>
